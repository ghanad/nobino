services:
  postgres:
    image: postgres:16-alpine
    container_name: nobino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nobino
      POSTGRES_USER: nobino
      POSTGRES_PASSWORD: nobino
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nobino -d nobino"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
