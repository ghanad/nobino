version: "2.2"

services:
  nobino:
    image: ghanad/nobino:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      TZ: Asia/Tehran
      APP_TIMEZONE: Asia/Tehran
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      BALE_BOT_USERNAME: ${BALE_BOT_USERNAME:-}
      BALE_SYNC_SECRET: ${BALE_SYNC_SECRET:-}
      DATABASE_URL: file:/data/nobino.sqlite
      DOCUMENT_IMAGE_DIR: /data/document-images
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      LDAP_AUTH_METHOD: ${LDAP_AUTH_METHOD:-node}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_USER_DN_TEMPLATE: ${LDAP_USER_DN_TEMPLATE:-}
      LDAP_USER_BIND_ATTRIBUTE: ${LDAP_USER_BIND_ATTRIBUTE:-}
      LDAP_EMAIL_ATTRIBUTE: ${LDAP_EMAIL_ATTRIBUTE:-mail}
      LDAP_NAME_ATTRIBUTE: ${LDAP_NAME_ATTRIBUTE:-displayName}
      LDAP_CONNECT_TIMEOUT_MS: ${LDAP_CONNECT_TIMEOUT_MS:-5000}
      LDAP_TIMEOUT_MS: ${LDAP_TIMEOUT_MS:-5000}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      SESSION_COOKIE_SECURE: "false"
      NEXT_PUBLIC_APP_NAME: Nobino
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
